<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SOSH Archive 2030</title>
<!--
Keep this HTML in the same folder as:
dark.png, Book.png, logo.png,
live.png, microphone.png, night.png, communal.png, workshop.png, ticket.png,
handwritten.png, poloroids.png, bali.png, japan.png, philippines.png,
partnership.png, voicemail.png,
page-turn.mp4, voicemail.mp4
-->
<style>
:root{
  --paper:#f1dfb8;
  --ink:#211711;
  --red:#7b251b;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono","Courier New",monospace;
  --paper-texture:
    linear-gradient(90deg,rgba(76,48,20,.16),rgba(255,247,218,.23) 10%,rgba(255,247,218,.12) 86%,rgba(76,48,20,.15)),
    radial-gradient(circle at 12% 18%, rgba(116,83,42,.055) 0 1px, transparent 1.5px),
    radial-gradient(circle at 72% 32%, rgba(116,83,42,.04) 0 1px, transparent 1.4px),
    repeating-linear-gradient(0deg, rgba(96,63,29,.03) 0 1px, transparent 1px 5px),
    linear-gradient(135deg, #f8e9c3 0%, #efd9aa 47%, #e2c58d 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14100c;color:var(--ink);font-family:var(--sans)}
body{
  background:
    radial-gradient(circle at 50% 35%, rgba(255,221,154,.34), transparent 34%),
    radial-gradient(circle at 50% 78%, rgba(0,0,0,.04), rgba(0,0,0,.80) 72%),
    url("dark.png") center/cover no-repeat,
    #15100c;
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.035) 0 1px, transparent 1px 7px);
  opacity:.14;mix-blend-mode:screen;
}
.app{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;padding:28px}
.topbar{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:160;color:#ead6a5;font:800 10px var(--mono);letter-spacing:2.2px;text-transform:uppercase;
  text-shadow:0 2px 6px #000;opacity:.92;text-align:center;
}
.progress{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:160;color:#e6d1a0;font:800 10px var(--mono);letter-spacing:2px;text-transform:uppercase;
  text-shadow:0 2px 6px #000;opacity:.94;
}
.sound-toggle{
  position:fixed;right:22px;top:18px;z-index:160;border:1px solid rgba(230,205,148,.32);
  background:rgba(35,23,13,.78);color:#ead7a8;padding:10px 12px;border-radius:999px;
  font:900 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;
}
.scene{
  width:min(1420px,96vw);height:min(820px,86vh);display:grid;
  grid-template-columns:minmax(760px,1fr) 360px;gap:18px;align-items:center;perspective:2400px;
}
.book-area{height:100%;display:flex;align-items:center;justify-content:center;position:relative;transform-style:preserve-3d}

/* COVER */
.cover{
  position:absolute;width:min(560px,46vw);height:min(690px,78vh);
  border-radius:23px 34px 34px 23px;
  background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.05) 35%,rgba(0,0,0,.18)), url("Book.png") center/cover no-repeat;
  transform:rotateX(7deg) rotateZ(-1.2deg);
  transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;
  z-index:80;cursor:pointer;
  box-shadow:0 52px 90px rgba(0,0,0,.82),0 0 0 1px rgba(255,220,150,.20), inset 0 0 0 1px rgba(242,209,116,.18);
  transition:transform .55s ease, filter .55s ease;
}
.cover:hover{transform:rotateX(7deg) rotateZ(-1.2deg) translateY(-8px);filter:brightness(1.08)}
.logo-hole{
  position:absolute;top:58px;left:50%;transform:translateX(-50%);
  width:150px;height:76px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;border-radius:0;z-index:3;
}
.logo-hole img{max-width:100%;max-height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.38))}
.cover-title{
  position:absolute;top:198px;left:0;right:0;text-align:center;z-index:3;color:#e8c86c;
  text-shadow:0 2px 0 rgba(85,53,15,.8),0 10px 30px rgba(0,0,0,.6);
  font-family:var(--serif);font-weight:700;
}
.cover-title .sosh{font-size:76px;line-height:.84;letter-spacing:3px}
.cover-title .archive{font-size:42px;line-height:1;letter-spacing:6px}
.cover-title .year{margin-top:16px;font:900 14px var(--mono);letter-spacing:8px;color:#dfc16d}
.cover-sub{
  position:absolute;left:0;right:0;bottom:92px;text-align:center;z-index:3;
  color:#dfca91;font:800 11px/1.6 var(--mono);letter-spacing:2px;text-transform:uppercase;
}
.cover.opening{animation:coverOpen .72s cubic-bezier(.18,.72,.16,1) forwards;pointer-events:none}
@keyframes coverOpen{
  0%{transform:rotateX(7deg) rotateZ(-1.2deg) rotateY(0);opacity:1}
  100%{transform:rotateX(7deg) rotateZ(-1.2deg) rotateY(-132deg);opacity:0;visibility:hidden}
}

/* BOOK */
.book{
  width:min(1000px,100%);height:min(655px,78vh);position:relative;display:grid;grid-template-columns:1fr 1fr;
  transform:rotateX(5deg);transform-style:preserve-3d;opacity:0;pointer-events:none;transition:opacity .15s ease;
  filter:drop-shadow(0 48px 60px rgba(0,0,0,.66));
}
.opened .book{opacity:1;pointer-events:auto}
.book-base{
  position:absolute;inset:-24px -30px;border-radius:30px;
  background:linear-gradient(90deg,rgba(0,0,0,.36),rgba(255,255,255,.09) 50%,rgba(0,0,0,.34)),#c8ad79;
  transform:translateZ(-25px);
  box-shadow:inset 0 0 0 2px rgba(242,213,154,.25), inset 0 0 0 11px rgba(55,34,16,.22);
}
.book:before{
  content:"";position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);
  z-index:8;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(77,50,23,.28) 42%,rgba(255,245,208,.18) 50%,rgba(77,50,23,.28) 58%,transparent);
}
.book:after{
  content:"";position:absolute;right:-17px;top:18px;bottom:18px;width:20px;z-index:2;pointer-events:none;border-radius:0 18px 18px 0;
  background:repeating-linear-gradient(0deg,#d8bc82 0 2px,#caa86d 2px 3px,#ead4a0 3px 5px);
  box-shadow:8px 0 22px rgba(0,0,0,.26), inset -4px 0 8px rgba(75,45,18,.22);
}
.page{
  height:100%;position:relative;overflow:hidden;padding:42px 46px;
  background:var(--paper-texture),var(--paper);
  background-blend-mode:multiply,normal,normal,normal,normal;
  color:var(--ink);border:1px solid rgba(83,55,27,.24);
  box-shadow:inset 0 0 42px rgba(72,48,23,.18), inset 0 0 0 9999px rgba(245,224,178,.08);
  opacity:1;
}
.page>*{position:relative;z-index:1}
.left-page{border-radius:18px 4px 4px 18px;cursor:w-resize}
.right-page{border-radius:4px 18px 18px 4px;cursor:e-resize}
.left-page:after{content:"";position:absolute;top:0;right:0;bottom:0;width:32px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.23));pointer-events:none;z-index:4}
.right-page:after{content:"";position:absolute;top:0;left:0;bottom:0;width:32px;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent);pointer-events:none;z-index:4}
.page-num{position:absolute;bottom:20px;font:900 10px var(--mono);letter-spacing:1.3px;color:#987a50}
.left-page .page-num{left:40px}.right-page .page-num{right:40px}

/* FLIP */
.flip-sheet{
  position:absolute;top:0;left:50%;width:50%;height:100%;z-index:140;display:none;
  transform-origin:left center;transform-style:preserve-3d;pointer-events:none;
}
.flip-sheet.active{display:block;animation:flipForward .72s cubic-bezier(.2,.74,.18,1) forwards}
.flip-sheet.back{left:0;transform-origin:right center}
.flip-sheet.back.active{display:block;animation:flipBack .72s cubic-bezier(.2,.74,.18,1) forwards}
@keyframes flipForward{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes flipBack{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
.face{
  position:absolute;inset:0;padding:42px 46px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;
  background:var(--paper-texture),var(--paper) !important;
  background-blend-mode:multiply,normal,normal,normal,normal;
  border:1px solid rgba(83,55,27,.24);
  box-shadow:inset 0 0 42px rgba(72,48,23,.18),0 12px 32px rgba(0,0,0,.18);
  opacity:1 !important;
}
.face.front{border-radius:4px 18px 18px 4px}
.face.backface{transform:rotateY(180deg);border-radius:18px 4px 4px 18px}
.flip-sheet.back .face.front{border-radius:18px 4px 4px 18px}
.flip-sheet.back .face.backface{border-radius:4px 18px 18px 4px}
.blank-flip-page{position:absolute;inset:0;background:var(--paper-texture),var(--paper);background-blend-mode:multiply,normal,normal,normal,normal;opacity:1}

/* DIVIDERS */
.dividers{
  position:absolute;left:calc(100% - 8px);top:64px;width:116px;z-index:20;display:flex;flex-direction:column;gap:8px;
  opacity:0;pointer-events:none;transition:opacity .25s ease .3s;
}
.opened .dividers{opacity:1;pointer-events:auto}
.divider{
  height:34px;width:76px;border:0;cursor:pointer;text-align:left;padding:0 10px 0 13px;border-radius:0 9px 9px 0;
  background:#e2c274;color:#2a1b0f;box-shadow:9px 8px 18px rgba(0,0,0,.22), inset 0 0 0 1px rgba(77,46,15,.18);
  font:900 9px/34px var(--mono);letter-spacing:1px;text-transform:uppercase;transition:width .2s ease, filter .2s ease;
}
.divider:hover,.divider.active{width:104px;filter:brightness(1.05)}
.divider.active{background:#7b251b;color:#f9e2aa}

/* TYPE */
h1,h2,h3,p{margin:0}
.kicker{font:900 10px var(--mono);letter-spacing:2.2px;text-transform:uppercase;color:var(--red);margin-bottom:13px}
.title-xl{font-family:var(--serif);font-size:56px;line-height:.9;letter-spacing:-2px;color:#211711}
.title{font-family:var(--serif);font-size:43px;line-height:.96;letter-spacing:-1.1px;color:#211711}
.caption-hand{font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-size:24px;line-height:1.05;color:#422a1b;transform:rotate(-1deg)}
.copy{font:520 15px/1.58 var(--sans);color:#433326;max-width:430px}
.small{font:900 10px/1.5 var(--mono);letter-spacing:1.2px;color:#74593a;text-transform:uppercase}
.rule{height:1px;background:rgba(98,65,30,.23);margin:19px 0}
.bullets{padding-left:18px;margin:16px 0 0}
.bullets li{margin:8px 0;font:600 14px/1.4 var(--sans);color:#433326}
.date-stamp{display:inline-block;border:2px solid rgba(123,37,27,.48);color:var(--red);padding:7px 10px;font:900 10px var(--mono);letter-spacing:1.6px;text-transform:uppercase;transform:rotate(-3deg)}
.archive-label{display:inline-block;background:#2b1b10;color:#f5dfad;border-radius:999px;padding:8px 11px;font:900 9px var(--mono);letter-spacing:1.5px;text-transform:uppercase}
.photo{position:relative;background:#f7ead0;opacity:1;padding:10px;border:1px solid rgba(86,56,25,.18);box-shadow:0 17px 28px rgba(55,34,16,.25);transform:rotate(-1.2deg)}
.photo img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(.96)}
.photo.polaroid{padding-bottom:42px}
.photo .label{position:absolute;left:14px;right:14px;bottom:12px;font:900 9px var(--mono);letter-spacing:1.2px;color:#735638;text-transform:uppercase}
.tape{position:absolute;top:-13px;left:38%;width:82px;height:27px;background:rgba(228,208,155,.67);border:1px solid rgba(140,111,61,.18);box-shadow:0 3px 9px rgba(0,0,0,.12);transform:rotate(4deg);z-index:2}
.paper-chip{background:#f7e5b9;border:1px solid rgba(96,62,27,.18);padding:13px 14px;box-shadow:0 10px 20px rgba(66,41,18,.16);font:900 10px/1.3 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:#2c1d12}
.paper-chip span{display:block;margin-top:7px;font:600 13px/1.34 var(--sans);letter-spacing:0;text-transform:none;color:#5d472f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stack{display:grid;gap:13px}
.text-only-card{height:100%;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;background:linear-gradient(135deg,#f7e6bd,#e7c993);color:#5c432c;font:900 10px/1.5 var(--mono);letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(95,62,27,.16)}

/* NAV BUTTONS */
.nav-buttons{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);display:flex;gap:12px;z-index:45;opacity:0;pointer-events:none;transition:opacity .35s ease .3s}
.opened .nav-buttons{opacity:1;pointer-events:auto}
.nav-btn{border:1px solid rgba(230,205,148,.35);background:rgba(35,23,13,.8);color:#ead7a8;padding:12px 18px;border-radius:999px;font:900 10px var(--mono);letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;box-shadow:0 9px 20px rgba(0,0,0,.3)}
.nav-btn:hover{background:#ead7a8;color:#25180d}.nav-btn:disabled{opacity:.35;cursor:not-allowed}

/* NOTE */
.note-area{height:100%;position:relative;z-index:60;opacity:0;pointer-events:none;transition:opacity .35s ease .3s}
.opened .note-area{opacity:1;pointer-events:auto}
.sticky{
  position:absolute;top:50%;left:42px;transform:translateY(-50%) rotate(1.2deg);width:315px;max-height:min(610px,74vh);overflow:auto;
  background:linear-gradient(180deg,rgba(255,248,204,.98),rgba(244,224,151,.98)),#f8e68f;color:#211711;border-radius:6px 6px 14px 6px;
  padding:26px 23px 22px;box-shadow:0 26px 60px rgba(0,0,0,.45), inset 0 -20px 40px rgba(138,100,21,.08);border:1px solid rgba(113,80,25,.18);
}
.sticky:before{content:"";position:absolute;top:-15px;left:50%;width:26px;height:26px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 35%,#fff2b7,#b41e15 45%,#65100b 75%);box-shadow:0 5px 12px rgba(0,0,0,.3)}
.sticky:after{content:"";position:absolute;top:12px;right:28px;width:54px;height:17px;border:3px solid rgba(80,65,50,.42);border-left:0;border-radius:0 14px 14px 0;transform:rotate(18deg)}
.sticky.social{background:linear-gradient(180deg,#fff3be,#f0d982)}.sticky.events{background:linear-gradient(180deg,#fff0ad,#edcc75)}.sticky.insider{background:linear-gradient(180deg,#ffe0d8,#efb7aa)}.sticky.membership{background:linear-gradient(180deg,#e4f0ff,#bcd2e9)}.sticky.signature{background:linear-gradient(180deg,#ffe7bd,#e5be7e)}.sticky.between{background:linear-gradient(180deg,#fff0c8,#eccf8d)}.sticky.partners{background:linear-gradient(180deg,#ead8b1,#cfae76)}.sticky.roadmap{background:linear-gradient(180deg,#dcefff,#a9c8e2)}
.note-kicker{font:900 10px var(--mono);letter-spacing:1.7px;text-transform:uppercase;color:#842a1e;margin-bottom:12px}
.note-title{font-family:var(--serif);font-size:27px;line-height:.96;letter-spacing:-.6px;margin-bottom:14px}
.note-body{font:560 13.2px/1.52 var(--sans);color:#3a2b1f}.note-section{margin-top:15px;padding-top:13px;border-top:1px solid rgba(102,74,26,.2)}.note-section b{display:block;font:900 10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:#7a251b;margin-bottom:7px}
.read-more{margin-top:18px;border:0;background:#2b1b10;color:#f8e8aa;border-radius:999px;padding:10px 14px;font:900 10px var(--mono);letter-spacing:1.3px;text-transform:uppercase;cursor:pointer}
.more{display:none;margin-top:15px}.sticky.expanded .more{display:block}
.play-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(35,23,13,.86);color:#f7df9d;border:1px solid rgba(247,223,157,.45);padding:12px 16px;border-radius:999px;font:900 10px var(--mono);letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 10px 25px rgba(0,0,0,.35)}
.voicemail-card:hover .play-badge{background:#7b251b;color:#fff1bd}

/* CLEAN ROADMAP */
.foldout-open .book{width:min(1180px,100%)}.foldout-open .right-page{overflow:visible}
.foldout-panel{
  position:absolute;left:16px;right:-170px;top:58px;height:470px;z-index:9;
  background:linear-gradient(180deg,rgba(234,215,168,.96),rgba(210,188,142,.96)),#e6d0a1;
  border:1px solid rgba(78,54,27,.24);box-shadow:0 25px 45px rgba(0,0,0,.28);transform-origin:left center;animation:unfold .8s cubic-bezier(.2,.74,.18,1) both;padding:44px;
}
@keyframes unfold{from{transform:scaleX(.18);opacity:.3}to{transform:scaleX(1);opacity:1}}
.clean-journey{width:min(520px,92%);margin:26px auto 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.clean-journey div{width:260px;max-width:100%;padding:12px 18px;text-align:center;background:rgba(255,244,210,.72);border:1px solid rgba(56,43,28,.24);border-radius:999px;font:900 11px var(--mono);letter-spacing:1.7px;text-transform:uppercase;color:#2a1b0f;box-shadow:0 6px 14px rgba(64,42,20,.10)}
.clean-journey span{font-family:var(--serif);font-size:20px;color:#7b251b;line-height:.8}.clean-journey .final{background:#7b251b;color:#f9e2aa;border-color:rgba(123,37,27,.45);transform:scale(1.06)}

@media(max-width:1120px){.scene{grid-template-columns:1fr 350px;gap:12px}.sticky{width:315px}.title-xl{font-size:45px}.title{font-size:35px}.caption-hand{font-size:20px}.page,.face{padding:34px 36px}}
@media(max-width:900px){body{overflow:auto}html,body{height:auto;min-height:100%}.app{height:auto;min-height:100vh;align-items:flex-start}.scene{grid-template-columns:1fr;gap:20px;height:auto;margin-top:50px}.book-area{height:700px}.note-area{height:460px}.sticky{left:50%;transform:translateX(-50%) rotate(1deg);top:0}.cover{width:82vw}.book{width:96vw;height:620px}.dividers{left:auto;right:-2px;top:74px}}
</style>
</head>
<body>
<button class="sound-toggle" id="soundToggle">Sound On</button>
<div class="topbar" id="topbar">Click the cover to open the archive</div>
<div class="progress" id="progress">Closed archive</div>
<audio id="pageAudio" preload="auto" src="page-turn.mp4"></audio>
<audio id="voicemailAudio" preload="auto" src="voicemail.mp4"></audio>

<main class="app">
<section class="scene" id="scene">
  <section class="book-area">
    <div class="cover" id="cover">
      <div class="logo-hole"><img src="logo.png" alt="SOSH logo"></div>
      <div class="cover-title"><div class="sosh">SOSH</div><div class="archive">ARCHIVE</div><div class="year">2030</div></div>
      <div class="cover-sub">A record of how belonging evolved</div>
    </div>
    <div class="book" id="book">
      <div class="book-base"></div>
      <article class="page left-page" id="leftPage"></article>
      <article class="page right-page" id="rightPage"></article>
      <nav class="dividers" id="dividers"></nav>
      <div class="flip-sheet" id="flipSheet"><div class="face front" id="flipFront"></div><div class="face backface" id="flipBack"></div></div>
      <div class="nav-buttons"><button class="nav-btn" id="prevBtn">← Previous</button><button class="nav-btn" id="nextBtn">Next →</button></div>
    </div>
  </section>
  <aside class="note-area">
    <div class="sticky" id="sticky">
      <div class="note-kicker" id="noteKicker">Strategy note</div>
      <h2 class="note-title" id="noteTitle">Open the archive</h2>
      <p class="note-body" id="noteBody">Turn the pages. The note changes with each spread.</p>
      <div class="note-section"><b>Why it matters</b><p class="note-body" id="noteA"></p></div>
      <div class="note-section"><b>How it works</b><p class="note-body" id="noteB"></p></div>
      <button class="read-more" id="readMore">Read More</button>
      <div class="more"><div class="note-section"><b>What happens next</b><p class="note-body" id="noteMore"></p></div></div>
    </div>
  </aside>
</section>
</main>

<script>
const chapters=[
{id:"index",label:"INDEX",page:0},{id:"social",label:"SOCIAL",page:1},{id:"events",label:"EVENTS",page:7},{id:"insider",label:"INSIDER",page:12},{id:"membership",label:"MEMBER",page:17},{id:"signature",label:"TRAVEL",page:20},{id:"between",label:"BETWEEN",page:26},{id:"partners",label:"KEEPERS",page:31},{id:"roadmap",label:"ROADMAP",page:34}
];

const spreads=[
{chapter:"index",note:{kicker:"How to read this",title:"SOSH Archive 2030",body:"This archive imagines Sosh as it could be remembered in 2030: through pages, photographs, notes, tickets, rituals, trips and community objects.",a:"It lets the pitch feel discovered instead of explained. The book carries the memory; this pinned note carries the strategy.",b:"Use Next and Previous to turn pages. Click the right page to move forward, the left page to move back. Use the divider tabs to jump chapters.",more:"The structure avoids a basic pitch deck by making Sosh feel like a world that already exists. It shows how content, events, membership, travel and partnerships become one system of belonging."},left:`<div class="kicker">SOSH Archive 2030</div><h1 class="title-xl">Archive Index</h1><ul class="bullets"><li>A record of Sosh through the years.</li><li>Media, events, membership, travel and community rituals.</li><li>Book pages show the memory.</li><li>The pinned note explains the idea.</li><li>Click pages, use buttons, or use divider tabs.</li></ul><div class="rule"></div><p class="small">Open slowly. Read like a scrapbook.</p><span class="page-num">001</span>`,right:`<div class="kicker">Catalog of sections</div><div class="stack"><div class="paper-chip">Chapter 1 — Social<span>How Sosh evolved from events into media.</span></div><div class="paper-chip">Chapter 2 — Events<span>Friendship through experiences.</span></div><div class="paper-chip">Chapter 3 — Inside the Insider<span>Smaller rooms. Deeper meaning.</span></div><div class="paper-chip">Chapter 4 — Membership Evolution<span>Not loyalty. Identity.</span></div><div class="paper-chip">Chapter 5 — Signature Experiences<span>The dream chapter. Travel-heavy and memory-rich.</span></div><div class="paper-chip">Chapter 6 — Between Moments<span>The invisible layer outside events.</span></div></div><span class="page-num">002</span>`},
{chapter:"social",note:{kicker:"Chapter 1 / Social",title:"How Sosh evolved from events into media",body:"The media layer becomes the front door to the Sosh world. People first discover Sosh through a feeling: a sharp observation, a recommendation, a conversation, or a clip that feels exactly like their life.",a:"Events are limited by space. Media makes the feeling travel. It lets Sosh build trust before someone ever enters a room.",b:"Social is divided into Live Shows, Sosh Radio, Short Form, Long Form, Creator Conversations and Audience Participation. Together, they create a loop from attention to trust to attendance.",more:"The goal is not to become a generic content company. The goal is to make Sosh’s taste, humor, honesty and emotional intelligence visible every day, so attending an event feels like entering a world people already understand."},left:`<div class="kicker">Chapter 1</div><h1 class="title-xl">Social</h1><p class="copy">How Sosh evolved from events into media.</p><div class="rule"></div><div class="paper-chip">Inside pages<span>Live Shows · Sosh Radio · Short Form · Long Form · Creator Conversations · Audience Participation</span></div><span class="page-num">003</span>`,right:`<div class="photo polaroid" style="height:360px;margin-top:18px;transform:rotate(-1.5deg)"><span class="tape"></span><img src="live.png"><div class="label">Warm rooms / live conversations / people laughing</div></div><p class="caption-hand" style="margin-top:28px">The audience stopped being an audience.</p><span class="page-num">004</span>`},
{chapter:"social",note:{kicker:"Social / Live Shows",title:"Live Shows",body:"A live show lets Sosh turn followers into participants. It is not stand-up, not a panel and not a Q&A. It is a public version of a private conversation that the room is invited to enter.",a:"Creator audiences want to hear the unfiltered thoughts behind the content. Live shows deepen that relationship and turn passive viewing into shared presence.",b:"First half: Saksham and Adil talk through a topic with real stakes. Second half: selected people from the room come into the conversation because they have something meaningful to add.",more:"One live show creates ticket revenue, clips for short form, long-form discussion, audience research, community trust and demand for future city events."},left:`<div class="kicker">Live Shows</div><span class="date-stamp">November 2028</span><div class="photo polaroid" style="height:385px;margin-top:26px;transform:rotate(-1.2deg)"><div class="text-only-card">LIVE SHOW ROOM<br>archive photograph</div><div class="label">Live Show Room</div></div><span class="page-num">005</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">The audience stopped being an audience.</p><div class="rule"></div><div class="grid2"><div class="paper-chip">Microphone<span>One room. One conversation.</span></div><div class="paper-chip">Question cards<span>Not Q&A. Contributions.</span></div><div class="paper-chip">Ticket stub<span>Admit one, but leave as part of the room.</span></div><div class="paper-chip">Soundcheck note<span>Topic with genuine stakes.</span></div></div></div><span class="page-num">006</span>`},
{chapter:"social",note:{kicker:"Social / Sosh Radio",title:"Sosh Radio",body:"Sosh Radio is the intimate audio layer: car rides, dinner drives, city notes, recommendations and unscripted reflections. It makes the founders feel present in people’s lives without needing a formal studio.",a:"It gives the brand warmth. People do not just want places to go; they want the voice and taste of people they trust.",b:"Episodes can be voice-note style, podcast style or short audio dispatches. The best format is casual: recorded on the way to dinner, after an event, or while trying something new in a city.",more:"A night drive can become one podcast, five reels, a newsletter, a city recommendation list and a pre-event trust builder."},left:`<div class="kicker">Sosh Radio</div><div class="photo polaroid" style="height:390px;margin-top:18px;transform:rotate(.9deg)"><span class="tape"></span><img src="night.png"><div class="label">Night Drive Conversations</div></div><span class="page-num">007</span>`,right:`<div class="kicker">Audio notes / dashboard / coffee cup</div><div class="photo" style="height:205px;transform:rotate(-1deg)"><img src="microphone.png"></div><p class="caption-hand" style="margin-top:32px">Recorded on the way to dinner.</p><div class="rule"></div><div class="paper-chip">Format<span>Unscripted, warm, specific, city-led.</span></div><span class="page-num">008</span>`},
{chapter:"social",note:{kicker:"Social / Short Form",title:"Short Form",body:"Short form should be built around precise social observations and location-led feelings, not generic listicles.",a:"Saves and shares are more important than likes because they show usefulness.",b:"Use hooks like: places that feel like Sunday even on Wednesday; where to go alone without feeling alone; restaurants for when you want to talk for three hours.",more:"Every post can point to a guide, a Sosh Radio episode, a live show topic, a Discovery Event, or a partner venue."},left:`<div class="kicker">Short Form</div><h2 class="title">Small observations travelled furthest.</h2><div class="rule"></div><div class="stack"><div class="paper-chip">Saved posts<span>Proof that the idea was useful.</span></div><div class="paper-chip">Comments<span>People adding their own city memory.</span></div><div class="paper-chip">Shared moments<span>One observation moving through friend groups.</span></div></div><span class="page-num">009</span>`,right:`<div class="photo polaroid" style="height:380px;transform:rotate(-1.6deg)"><span class="tape"></span><img src="handwritten.png"><div class="label">Printed screenshots / comments / saved recommendations</div></div><span class="page-num">010</span>`},
{chapter:"social",note:{kicker:"Social / Long Form",title:"Long Form",body:"Long form is where Sosh builds trust. The topics Sosh already owns need more room than a two-minute clip.",a:"People crave the true unfiltered friendship between the founders.",b:"Use podcasts, essays, annotated transcripts, behind-the-scenes dinners, trying new food in new cities and city diaries.",more:"Long form creates depth, short form distributes it, live shows make it participatory, and events convert trust into real-world community."},left:`<div class="kicker">Long Form</div><div class="photo" style="height:395px;transform:rotate(.8deg)"><span class="tape"></span><div class="text-only-card">ANNOTATED TRANSCRIPT<br>printed essays</div></div><span class="page-num">011</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">Attention became trust.</p><div class="rule"></div><div class="paper-chip">Annotated transcript<span>What people highlighted became future episodes.</span></div><div class="paper-chip" style="margin-top:14px">Podcast clipping system<span>One long conversation, many social assets.</span></div></div><span class="page-num">012</span>`},
{chapter:"social",note:{kicker:"Social / Creator Conversations",title:"Creator Conversations + Audience Participation",body:"Sosh can host conversations with creators, chefs, founders, artists, therapists, athletes and city people who share its obsession with connection and taste.",a:"Guests become doorways into new audiences and communities.",b:"Tie each creator conversation to a real experience: a dinner, a walk, a workshop, a radio episode or a city guide.",more:"The long-term play is a Sosh conversation network — curated people who make life in a city feel more alive."},left:`<div class="kicker">Creator Conversations</div><h2 class="title">The city had more voices than one.</h2><p class="copy" style="margin-top:18px">Conversations with people who understand food, friendship, work, creativity, loneliness, wellness and city life.</p><div class="rule"></div><div class="paper-chip">Guest note<span>Creators as community bridges.</span></div><span class="page-num">013</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">The conversation kept making rooms.</p><div class="rule"></div><div class="paper-chip">Audience participation<span>Fans contributed instead of only watching.</span></div></div><span class="page-num">014</span>`},

{chapter:"events",note:{kicker:"Chapter 2 / Events",title:"Friendship through experiences",body:"Events are the physical infrastructure of Sosh. They turn taste and attention into rooms where people can actually meet, talk, return and remember.",a:"The audience is urban and allergic to anything try-hard. Events must feel designed, but not forced.",b:"Discovery Events, Workshop Nights, Food Experiences, Sports With A Twist and City Walks each solve a different social entry point.",more:"The pitch is not random events; it is a progression funnel from accessible first rooms to deeper second rooms."},left:`<div class="kicker">Chapter 2</div><h1 class="title-xl">Events</h1><p class="copy">Friendship through experiences.</p><div class="rule"></div><div class="paper-chip">Recovered material<span>Tickets · event photos · guest lists · maps · notes · name tags</span></div><span class="page-num">017</span>`,right:`<div class="photo polaroid" style="height:385px;transform:rotate(1.1deg)"><span class="tape"></span><img src="communal.png"><div class="label">Communal Dinner Gathering</div></div><p class="caption-hand" style="margin-top:24px">14,209 introductions.</p><span class="page-num">018</span>`},
{chapter:"events",note:{kicker:"Events / Discovery",title:"Discovery Events",body:"Discovery Events are accessible, affordable, low-commitment and shareable.",a:"They solve the first-meeting problem.",b:"30–35 people. Activity-led. High-energy. Designed around food, drinks, workshops, city walks and themed rooms.",more:"A waitlist system can create demand while repeatable formats allow scale."},left:`<div class="kicker">Discovery Events</div><h2 class="title">The first room was easy to enter.</h2><div class="rule"></div><div class="grid2"><div class="paper-chip">30–35 people<span>Enough energy, not anonymous.</span></div><div class="paper-chip">Activity-led<span>No awkward standing around.</span></div><div class="paper-chip">Affordable<span>Low commitment entry.</span></div><div class="paper-chip">Shareable<span>Designed to travel online.</span></div></div><span class="page-num">019</span>`,right:`<div class="photo" style="height:215px;transform:rotate(-1.2deg)"><img src="ticket.png"></div><div class="photo" style="height:215px;margin-top:18px;transform:rotate(1deg)"><div class="text-only-card">NAME TAGS<br>wristbands</div></div><span class="page-num">020</span>`},
{chapter:"events",note:{kicker:"Events / Workshop Nights",title:"Workshop Nights",body:"Workshop Nights let strangers bond through making something.",a:"The activity removes pressure because people can talk while their hands are occupied.",b:"Partner with studios and makers. The takeaway becomes a memory object, not merch.",more:"A rotating calendar can include ceramics, food styling, zines, cocktails, flower arranging, photography walks and repair nights."},left:`<div class="kicker">Workshop Nights</div><div class="photo polaroid" style="height:390px;transform:rotate(-1deg)"><span class="tape"></span><img src="workshop.png"><div class="label">Creative Workshop Table</div></div><span class="page-num">021</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">People spoke while their hands were busy.</p><div class="rule"></div><div class="paper-chip">Physical takeaway<span>Clay, paper, recipe, object, note.</span></div><div class="paper-chip" style="margin-top:13px">Partner layer<span>Studios become part of the ecosystem.</span></div></div><span class="page-num">022</span>`},
{chapter:"events",note:{kicker:"Events / Food Experiences",title:"Food Experiences",body:"Food is Sosh’s natural social technology.",a:"Food lowers social friction.",b:"Formats can include build-your-signature drink, BYO last meal, dinner with question jenga, tasting routes and chef-led tables.",more:"Food experiences become the backbone of partnerships with restaurants, cafés, coffee roasters and hotels."},left:`<div class="kicker">Food Experiences</div><h2 class="title">The table did half the hosting.</h2><p class="copy" style="margin-top:18px">Dinners, tasting routes, last meals, shared courses and meals that gave people a reason to linger.</p><span class="page-num">023</span>`,right:`<div class="photo polaroid" style="height:390px;transform:rotate(.9deg)"><div class="text-only-card">DINNER EXPERIMENTS<br>food experiences</div><div class="label">Dinner Experiments / Food Experiences</div></div><span class="page-num">024</span>`},
{chapter:"events",note:{kicker:"Events / Movement",title:"Sports With A Twist + City Walks",body:"Not every Sosh experience should be seated.",a:"Movement creates a lighter social mood and less pressure.",b:"Sports can include playful leagues and social scoring. City Walks can include cafés, architecture, bookstores, sunrise points and neighbourhood stories.",more:"These formats help Sosh expand across cities using existing parks, streets, food spots and local routes."},left:`<div class="kicker">Sports With A Twist</div><h2 class="title">The game was never only the game.</h2><div class="rule"></div><div class="paper-chip">Scorecard<span>Social scoring, inside jokes, team rituals.</span></div><div class="paper-chip" style="margin-top:14px">Post-game table<span>Movement turns into conversation.</span></div><span class="page-num">025</span>`,right:`<div class="kicker">City Walks</div><div class="photo" style="height:300px;transform:rotate(-1.2deg)"><span class="tape"></span><div class="text-only-card">CITY WALK MAP<br>annotated route</div></div><p class="caption-hand" style="margin-top:28px">The city became easier to enter.</p><span class="page-num">026</span>`},

{chapter:"insider",note:{kicker:"Chapter 3 / Inside the Insider",title:"Smaller rooms. Deeper meaning.",body:"Inside the Insider is where Sosh stops being an event brand and becomes a relationship.",a:"People return when they feel recognized.",b:"Archive Night, Grief Table, BYO Last Meal, House Party, Sunday Club and Dinner Experiments are personal, human and slightly sacred.",more:"This chapter builds retention and emotional depth."},left:`<div class="kicker">Chapter 3</div><h1 class="title-xl">Inside the Insider</h1><p class="copy">Smaller rooms. Deeper meaning.</p><div class="rule"></div><div class="paper-chip">Tone<span>Intimate · personal · emotional · human</span></div><span class="page-num">027</span>`,right:`<div class="photo polaroid" style="height:380px;transform:rotate(-.8deg)"><span class="tape"></span><img src="poloroids.png"><div class="label">Memory Polaroids</div></div><span class="page-num">028</span>`},
{chapter:"insider",note:{kicker:"Inside / Archive Night",title:"Archive Night",body:"Archive Night asks members to bring objects, photos, voice notes, messages or memories from their lives.",a:"Objects carry stories better than introductions do.",b:"Prompts: a place you miss, a message you never deleted, a food tied to someone, a photo that still feels alive.",more:"This can feed the annual Sosh Book, future exhibitions and community rituals."},left:`<div class="kicker">Archive Night</div><div class="photo polaroid" style="height:390px;transform:rotate(1deg)"><div class="text-only-card">ARCHIVE NIGHT<br>old photographs</div><div class="label">Old photographs / printed memories / voice notes</div></div><span class="page-num">029</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">Everyone brought something they had kept.</p><div class="rule"></div><div class="paper-chip">Object prompt<span>A memory you can hold.</span></div></div><span class="page-num">030</span>`},
{chapter:"insider",note:{kicker:"Inside / Grief Table",title:"Grief Table",body:"Grief Table is a carefully hosted dinner for conversations about loss, change, endings and adulthood.",a:"Deeper meaning often forms when people feel safe enough to be honest.",b:"Small group, clear consent, careful prompts, no forced vulnerability, beautiful food and a trained host where needed.",more:"This format should be rare and protected."},left:`<div class="kicker">Grief Table</div><h2 class="title">Some rooms were quieter.</h2><p class="copy" style="margin-top:18px">Folded letters. Pressed flowers. Menus with almost no decoration.</p><span class="page-num">031</span>`,right:`<div class="photo" style="height:310px;margin-top:32px;transform:rotate(-1.4deg)"><span class="tape"></span><div class="text-only-card">FOLDED LETTERS<br>pressed flowers</div></div><p class="caption-hand" style="margin-top:28px">Nothing needed to be performed.</p><span class="page-num">032</span>`},
{chapter:"insider",note:{kicker:"Inside / BYO Last Meal",title:"BYO Last Meal",body:"Each person brings or chooses a dish connected to memory.",a:"Food gives vulnerability a shape.",b:"Recipe cards, family photographs, handwritten notes and a shared table where every course belongs to someone.",more:"This can become recipe zines, memory cards, annual meal archive and restaurant editions."},left:`<div class="kicker">BYO Last Meal</div><div class="photo polaroid" style="height:375px;transform:rotate(.8deg)"><div class="text-only-card">BYO LAST MEAL<br>recipe cards</div><div class="label">Recipe cards / family photos / dinner table</div></div><span class="page-num">033</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">The dish explained what the person didn’t say first.</p><div class="rule"></div><div class="paper-chip">Recipe card<span>Memory served as a course.</span></div></div><span class="page-num">034</span>`},
{chapter:"insider",note:{kicker:"Inside / Social Rituals",title:"House Party, Sunday Club, Dinner Experiments",body:"These recurring formats make Sosh feel less like ticketed events and more like a rhythm in people’s lives.",a:"Meaning grows through repeated rituals.",b:"House Party feels hosted but informal. Sunday Club creates weekend continuity. Dinner Experiments test unusual formats.",more:"These can become monthly membership anchors."},left:`<div class="kicker">House Party</div><h2 class="title">Not the conventional one.</h2><div class="rule"></div><div class="paper-chip">Living room rules<span>No loud networking. No forced games. Just hosted ease.</span></div><div class="paper-chip" style="margin-top:14px">Sunday Club<span>A recurring room for people who want to return.</span></div><span class="page-num">035</span>`,right:`<div class="photo polaroid" style="height:380px;transform:rotate(-1deg)"><span class="tape"></span><div class="text-only-card">SUNDAY CLUB<br>dinner experiments</div><div class="label">Dinner Experiments / Sunday Club</div></div><span class="page-num">036</span>`},

{chapter:"membership",note:{kicker:"Chapter 4 / Membership Evolution",title:"Not loyalty. Identity.",body:"Sosh membership should not feel like a points program.",a:"The system rewards loyalty with intimacy and meaning.",b:"Curious begins after the first event. Insider begins after repeated return. Original begins when members become contributors.",more:"This creates status that does not feel cringe because it is based on participation and contribution."},left:`<div class="kicker">Chapter 4</div><h1 class="title-xl">Membership Evolution</h1><p class="copy">Not loyalty. Identity.</p><div class="rule"></div><div class="paper-chip">Progression<span>Curious → Insider → Belong</span></div><span class="page-num">037</span>`,right:`<div class="photo" style="height:330px;margin-top:20px;transform:rotate(.7deg)"><span class="tape"></span><div class="text-only-card">MEMBERSHIP OBJECTS<br>first ticket</div></div><p class="caption-hand" style="margin-top:28px">The first yes. The first return. Belong.</p><span class="page-num">038</span>`},
{chapter:"membership",note:{kicker:"Membership / Three Identities",title:"Curious, Insider, Belong",body:"Each level represents a deeper relationship with Sosh.",a:"Curious means the person has entered. Insider means they have returned. Belong means it has become part of their life.",b:"Curious unlocks waitlists and recommendations. Insider unlocks intimate events. Belong becomes emotional identity.",more:"This becomes powerful during city expansion as early members help seed new rooms."},left:`<div class="kicker">Curious</div><h2 class="title">The first yes.</h2><div class="rule"></div><div class="paper-chip">Artifacts<span>First ticket · first wristband · welcome note</span></div><div class="paper-chip" style="margin-top:14px">Access<span>Community group · event waitlists · weekly city recommendations</span></div><span class="page-num">039</span>`,right:`<div class="kicker">Insider / Belong</div><div class="paper-chip">Insider<span>Dinner photos · member notes · event invites · the first return</span></div><div class="paper-chip" style="margin-top:14px">Belong<span>The moment Sosh stops being an event and becomes a place in your life.</span></div><span class="page-num">040</span>`},
{chapter:"membership",note:{kicker:"Membership / Rituals",title:"Membership Rituals",body:"Membership needs physical and emotional proof.",a:"The strongest markers are not loud merch but small objects people keep.",b:"Use welcome notes, wristbands, annual books, priority invites, city guides and handwritten founder notes.",more:"The best membership objects feel like they belong in a drawer years later."},left:`<div class="kicker">Member Objects</div><div class="photo polaroid" style="height:380px;transform:rotate(-1.3deg)"><span class="tape"></span><div class="text-only-card">MEMBER OBJECTS<br>not merch</div><div class="label">Name tags & wristbands</div></div><span class="page-num">041</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">The merch couldn’t look like merch.</p><div class="rule"></div><div class="paper-chip">Physical proof<span>Objects that say: I was there.</span></div></div><span class="page-num">042</span>`},

{chapter:"signature",note:{kicker:"Chapter 5 / Signature Experiences",title:"The dream chapter",body:"Signature Experiences are the aspirational layer: beautiful, travel-heavy and memory-rich.",a:"Travel converts community into mythology.",b:"Bali Residency, Japan Ski Week, Philippines Dive Residency, Scuba Diving, Lisbon Creative Month, Sosh Houses, Desert Retreats, Founder Trips and Learning Expeditions create premium depth.",more:"This creates the stories that make people want to move deeper into membership."},left:`<div class="kicker">Chapter 5</div><h1 class="title-xl">Signature Experiences</h1><p class="copy">Aspirational. Beautiful. Travel-heavy. Memory-rich.</p><div class="rule"></div><div class="paper-chip">The dream chapter<span>Bali · Japan · Philippines · Scuba Diving · Lisbon · Sosh Houses · Founder Trips</span></div><span class="page-num">043</span>`,right:`<div class="photo polaroid" style="height:385px;transform:rotate(-1deg)"><span class="tape"></span><img src="bali.png"><div class="label">Bali Residency</div></div><span class="page-num">044</span>`},
{chapter:"signature",note:{kicker:"Signature / Bali Residency",title:"Bali Residency",body:"Bali is the flagship residency: villa living, hosted meals, creative workshops, local rituals, downtime and carefully designed connection.",a:"The value is who is in the house, how the days are held and what memories people leave with.",b:"12 people, 7 days, May 2026. Villa photos, passport stamps, boarding passes, scuba-diving notes, no-phone rituals and a map.",more:"The business model can include premium ticketing, partner villas, scuba partners, no-phone rituals and annual travel eligibility."},left:`<div class="kicker">Bali Residency</div><span class="date-stamp">12 people · 7 days · May 2026</span><div class="photo polaroid" style="height:390px;margin-top:24px;transform:rotate(.7deg)"><div class="text-only-card">BALI RESIDENCY<br>villa notes</div><div class="label">Villa photos / passport stamps / boarding pass / scuba notes / no phones</div></div><span class="page-num">045</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">12 people.<br>7 days.<br>May 2026.</p><div class="rule"></div><div class="paper-chip">Field note<span>Day 4. No phones. Scuba at 7am. Nobody wanted to leave.</span></div></div><span class="page-num">046</span>`},
{chapter:"signature",note:{kicker:"Signature / Japan Ski Week",title:"Japan Ski Week",body:"Japan Ski Week gives Sosh a winter flagship: snow, train journeys, lodge dinners, ski maps and lift passes.",a:"It offers a quieter, more cinematic tone.",b:"Build around small groups, shared logistics, lodge dinners, day notes, film photos and post-ski conversations.",more:"This can become an annual premium trip for Insiders."},left:`<div class="kicker">Japan Ski Week</div><div class="photo polaroid" style="height:390px;transform:rotate(-1deg)"><span class="tape"></span><img src="japan.png"><div class="label">Train tickets / lift passes / ski map / lodge nights</div></div><span class="page-num">047</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">The cold made everyone sit closer.</p><div class="rule"></div><div class="paper-chip">Travel object<span>Lift pass kept in wallet until summer.</span></div></div><span class="page-num">048</span>`},
{chapter:"signature",note:{kicker:"Signature / Philippines Dive Residency",title:"Philippines Dive Residency",body:"A scuba-diving residency gives Sosh an adventure format built around water, silence, shared courage, no-phone mornings and island rhythms.",a:"Scuba diving gives people a shared experience that is bodily, quiet and memorable.",b:"Artifacts include dive certifications, boat schedules, waterproof notes, island maps and sunset group photos.",more:"This attracts members who want nature and adventure rather than nightlife."},left:`<div class="kicker">Philippines Dive Residency</div><div class="photo polaroid" style="height:390px;transform:rotate(1deg)"><img src="philippines.png"><div class="label">Boat schedules / scuba gear / waterproof notes</div></div><span class="page-num">049</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">Some conversations happened after the water.</p><div class="rule"></div><div class="paper-chip">Island map<span>No phones. Just water, food and people.</span></div></div><span class="page-num">050</span>`},
{chapter:"signature",note:{kicker:"Signature / Lisbon + Sosh Houses",title:"Lisbon Creative Month + Sosh Houses",body:"These expand Sosh from events into temporary living and creative residency models.",a:"A month-long format gives members enough time to form routines.",b:"Sosh Houses can become city-based residences: part guesthouse, part community salon, part programming space.",more:"This turns Sosh into a lifestyle ecosystem without becoming generic hospitality."},left:`<div class="kicker">Lisbon Creative Month</div><h2 class="title">Some cities asked people to stay longer.</h2><p class="copy" style="margin-top:18px">Café tables, tram tickets, sketchbooks, postcards and month-long routines.</p><span class="page-num">051</span>`,right:`<div class="kicker">Sosh Houses</div><div class="photo" style="height:310px;margin-top:22px;transform:rotate(-1.1deg)"><span class="tape"></span><div class="text-only-card">SOSH HOUSES<br>city guide</div></div><p class="caption-hand" style="margin-top:24px">A room became a ritual.</p><span class="page-num">052</span>`},
{chapter:"signature",note:{kicker:"Signature / Retreats + Expeditions",title:"Desert Retreats, Founder Trips, Learning Expeditions",body:"These formats serve different member intentions: rest, access, growth, taste and learning.",a:"Not every trip has to be leisure.",b:"Founder Trips offer intimacy. Learning Expeditions bring experts into the field. Desert Retreats create quiet and reset.",more:"This gives Insiders something to aspire to beyond events."},left:`<div class="kicker">Desert Retreats</div><h2 class="title">Silence became part of the design.</h2><div class="rule"></div><div class="paper-chip">Founder Trips<span>Small-group travel with the people behind the world.</span></div><div class="paper-chip" style="margin-top:14px">Learning Expeditions<span>Travel with a subject, a guide and a group.</span></div><span class="page-num">053</span>`,right:`<div class="photo polaroid" style="height:355px;transform:rotate(.8deg)"><div class="text-only-card">SIGNATURE FIELD NOTES<br>future trip</div><div class="label">Signature experience field notes</div></div><span class="page-num">054</span>`},

{chapter:"between",note:{kicker:"Chapter 6 / Between Moments",title:"Community building outside events",body:"The Between Moments layer is the invisible infrastructure that makes people feel remembered even when there is no event happening.",a:"Most communities lose energy between gatherings.",b:"Letters, voicemails, annual books, postcards, reservations, introductions and birthday calls extend the emotional life of belonging.",more:"The person does not only remember Sosh when they see an event poster; Sosh appears in their mailbox, phone, calendar and city."},left:`<div class="kicker">Chapter 6</div><h1 class="title-xl">Between Moments</h1><p class="copy">Community building outside events. The invisible layer.</p><div class="rule"></div><div class="paper-chip">Formats<span>Future Letters · Voicemail · Annual Book · Postcards · Standing Reservations · City Introductions · Birthday Calls</span></div><span class="page-num">055</span>`,right:`<div class="photo polaroid" style="height:385px;transform:rotate(-1deg)"><span class="tape"></span><div class="text-only-card">ENVELOPE & POSTCARD SET<br>future letters</div><div class="label">Envelope & Postcard Set</div></div><span class="page-num">056</span>`},
{chapter:"between",note:{kicker:"Between / Future Letters",title:"Future Letters",body:"Members write a letter to themselves during an experience. Sosh mails it back months later.",a:"The memory arrives physically, not as a notification.",b:"Envelope, wax seal, postmark, date stamp and a quiet caption: some arrived exactly when they were needed.",more:"Future evolution can include postcards from strangers, voice letters, annual memory capsules and city-specific letter drops."},left:`<div class="kicker">Future Letters</div><div class="photo polaroid" style="height:390px;transform:rotate(.8deg)"><div class="text-only-card">FUTURE LETTERS<br>wax seal</div><div class="label">Envelope / wax seal / postmark</div></div><span class="page-num">057</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">Some arrived exactly when they were needed.</p><div class="rule"></div><div class="paper-chip">Postmark<span>Three months later, the night returned.</span></div></div><span class="page-num">058</span>`},
{chapter:"between",note:{kicker:"Between / Voicemail",title:"Sosh Voicemail",body:"A weekly two-minute voicemail from Saksham or Adil. Unscripted. Personal. Something people listen to twice and save.",a:"It feels like a call, not content.",b:"Use it for reflections, city recommendations, questions, pre-event notes and after-event memory. Keep it short and imperfect.",more:"This can become an Insider-only ritual or a public audio teaser that invites people deeper into the Sosh world."},left:`<div class="kicker">Voicemail</div><h2 class="title">A weekly two-minute call from the world.</h2><div class="rule"></div><div class="paper-chip">Unscripted<span>People listened twice.</span></div><div class="paper-chip" style="margin-top:14px">Saved audio<span>Founder intimacy at scale.</span></div><span class="page-num">059</span>`,right:`<div class="kicker">Voicemail 003 / Tap to play</div><div class="photo voicemail-card" id="voicemailCard" style="height:345px;margin-top:22px;transform:rotate(-1.2deg);cursor:pointer"><span class="tape"></span><img src="voicemail.png"><div class="play-badge" id="playBadge">▶ PLAY VOICEMAIL</div></div><p class="caption-hand" style="margin-top:22px;font-size:21px">Some messages were easier to hear later.</p><span class="page-num">060</span>`},
{chapter:"between",note:{kicker:"Between / Annual Book",title:"The Annual Sosh Book",body:"A printed living document updated annually with photos, confessions, memories and moments from that year.",a:"Owning it means you were part of something real.",b:"Each year’s book can include event photographs, anonymous notes, host letters, city pages, member stories and artifacts.",more:"This turns community into a collectible object."},left:`<div class="kicker">Annual Book</div><div class="photo polaroid" style="height:385px;transform:rotate(1deg)"><div class="text-only-card">ANNUAL SOSH BOOK<br>small print run</div><div class="label">Photos / confessions / memories / moments</div></div><span class="page-num">061</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">Owning it meant you were there.</p><div class="rule"></div><div class="paper-chip">Small print run<span>Not merch. Proof of belonging.</span></div></div><span class="page-num">062</span>`},
{chapter:"between",note:{kicker:"Between / Postcards + Reservations",title:"Postcards, Standing Reservations, City Introductions, Birthday Calls",body:"This is the quiet operating system of belonging.",a:"These gestures keep the relationship warm.",b:"Standing reservations: the table is already booked; you just show up. City introductions connect members across places. Birthday calls make the brand human.",more:"Together, these rituals build emotional retention loops."},left:`<div class="kicker">Postcards</div><div class="photo" style="height:300px;margin-top:20px;transform:rotate(-1.2deg)"><span class="tape"></span><div class="text-only-card">POSTCARD FROM A STRANGER<br>standing reservation</div></div><p class="caption-hand" style="margin-top:26px">A stranger wrote back.</p><span class="page-num">063</span>`,right:`<div class="kicker">Standing Reservations</div><h2 class="title">The table was already booked.</h2><div class="rule"></div><div class="paper-chip">City Introductions<span>Someone you should meet when you land.</span></div><div class="paper-chip" style="margin-top:14px">Birthday Calls<span>Small proof that someone remembered.</span></div><span class="page-num">064</span>`},

{chapter:"partners",note:{kicker:"Chapter 7 / Keepers of the Feeling",title:"Belonging found an address.",body:"Sosh never viewed partnerships as sponsors. Sponsors appear beside experiences. Partners become part of experiences.",a:"The strongest communities are built by places too: cafés where conversations start, restaurants that remember your name, hotels that become home in another city, and studios where strangers make together.",b:"Standing Tables, Community Keys, Friendship Menus and Local Embassies turned selected places into social infrastructure.",more:"The long-term vision was a network of places where belonging could reliably happen."},left:`<div class="kicker">Chapter 7</div><h1 class="title-xl">Keepers of the Feeling</h1><p class="copy">The places we loved began helping.</p><div class="rule"></div><div class="paper-chip">Artifacts<span>Coffee bags · keys · tickets · menus · ceramics · maps · reserved tables</span></div><span class="page-num">065</span>`,right:`<div class="photo polaroid" style="height:385px;transform:rotate(-1deg)"><span class="tape"></span><img src="partnership.png" onerror="this.outerHTML='<div class=&quot;text-only-card&quot;>PARTNERSHIP ECOSYSTEM<br>places that helped</div>'"><div class="label">Places that made friendship easier</div></div><p class="caption-hand" style="margin-top:24px">Belonging found an address.</p><span class="page-num">066</span>`},
{chapter:"partners",note:{kicker:"Keepers / Standing Tables",title:"The Standing Table Program",body:"Every Thursday at 7 PM, a partner café automatically reserved a table for Sosh members.",a:"This turns partner cafés into dependable third places.",b:"The café gets culturally aligned customers. Sosh gets recurring low-lift infrastructure. Members get a ritual that feels natural.",more:"This is stronger than a discount partnership because it changes behavior. It gives friendship a weekly address."},left:`<div class="kicker">Standing Tables</div><h2 class="title">Thursday, 7 PM.</h2><div class="rule"></div><div class="paper-chip">Reserved card<span>SOSH TABLE · 8 seats · see you Thursday</span></div><div class="paper-chip" style="margin-top:14px">Coffee receipt<span>Strangers became regulars.</span></div><span class="page-num">067</span>`,right:`<div style="height:100%;display:flex;flex-direction:column;justify-content:center"><p class="caption-hand">The usual table was already waiting.</p><div class="rule"></div><div class="paper-chip">Partner examples<span>Subko · Blue Tokai · Third Wave · local single-origin cafés</span></div></div><span class="page-num">068</span>`},
{chapter:"partners",note:{kicker:"Keepers / Community Keys",title:"Community Keys + Friendship Menus",body:"Hotels and restaurants became part of the Sosh ecosystem by turning arrival and dinner into social infrastructure.",a:"Community Keys made a new city feel smaller.",b:"Friendship Menus made dinners easier by building prompts into the meal.",more:"This made partnerships feel like memory, not marketing."},left:`<div class="kicker">Community Keys</div><div class="photo polaroid" style="height:375px;transform:rotate(-1deg)"><div class="text-only-card">COMMUNITY KEY<br>city guide</div><div class="label">Hotel key / city guide / handwritten recommendations</div></div><span class="page-num">069</span>`,right:`<div class="kicker">Friendship Menus</div><div class="paper-chip">Starter<span>Where are you from, really?</span></div><div class="paper-chip" style="margin-top:14px">Main<span>What are you working on becoming?</span></div><div class="paper-chip" style="margin-top:14px">Dessert<span>What is something you want to try?</span></div><span class="page-num">070</span>`},

{chapter:"roadmap",note:{kicker:"Chapter 8 / Roadmap",title:"Not company roadmap. Human roadmap.",body:"The final chapter is clean and reflective. Fewer artifacts. More space.",a:"It shows Sosh is not a collection of events, but a path from first discovery to genuine belonging.",b:"The journey: Discover → Attend → Return → Curious → Insider → Belong.",more:"The roadmap unfolds wider than previous pages, as if the system was hidden inside the archive all along."},left:`<div class="kicker">Chapter 8</div><h1 class="title-xl">Roadmap</h1><p class="copy">Final chapter. Fewer artifacts. More reflection.</p><div class="rule"></div><div class="paper-chip">Human roadmap<span>Not company roadmap.</span></div><span class="page-num">071</span>`,right:`<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center"><div><p class="caption-hand">What happens after community?</p><div class="rule"></div><span class="archive-label">Turn page to unfold blueprint</span></div></div><span class="page-num">072</span>`},
{chapter:"roadmap",foldout:true,note:{kicker:"Roadmap / Belonging Blueprint",title:"The Belonging Blueprint",body:"The blueprint connects every idea in the archive into one system.",a:"The path is emotional: discover Sosh, attend once, return because something stayed, become Curious, move into Insider, and eventually feel like you belong.",b:"The journey is designed as a human path, not a business funnel: Discover, Attend, Return, Curious, Insider, Belong.",more:"This is the pitch: Sosh can become infrastructure for adult belonging."},left:`<div class="kicker">Foldout Blueprint</div><h2 class="title">The whole system was hidden in the margins.</h2><p class="copy" style="margin-top:18px">The book unfolds wider than before. The archive becomes a map.</p><span class="page-num">073</span>`,right:`<div class="foldout-panel"><div class="kicker">Human Journey / 2030</div><h2 class="title">Discover → Attend → Return → Curious → Insider → Belong</h2><div class="clean-journey"><div>Discover</div><span>↓</span><div>Attend</div><span>↓</span><div>Return</div><span>↓</span><div>Curious</div><span>↓</span><div>Insider</div><span>↓</span><div class="final">Belong</div></div></div><span class="page-num">074</span>`},
{chapter:"roadmap",note:{kicker:"End page",title:"The next pages are still being written.",body:"The archive ends by making the future feel open.",a:"A pitch should create belief, not just understanding.",b:"The final feeling should be: I want to see this exist.",more:"The website should close like a book someone wants to reopen."},left:`<div class="kicker">Archive Status</div><h1 class="title-xl">Active.</h1><p class="copy" style="margin-top:18px">New pages continue to be added when someone arrives alone, returns, remembers, travels or finds their people through Sosh.</p><span class="page-num">075</span>`,right:`<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center"><div><p class="caption-hand" style="margin-top:28px">The next pages are still being written.</p></div></div><span class="page-num">076</span>`}
];

let current=0, opened=false, flipping=false, soundOn=true;
const scene=document.getElementById("scene"), cover=document.getElementById("cover"), leftPage=document.getElementById("leftPage"), rightPage=document.getElementById("rightPage"), flipSheet=document.getElementById("flipSheet"), flipFront=document.getElementById("flipFront"), flipBack=document.getElementById("flipBack"), progress=document.getElementById("progress"), topbar=document.getElementById("topbar"), prevBtn=document.getElementById("prevBtn"), nextBtn=document.getElementById("nextBtn"), dividers=document.getElementById("dividers"), sticky=document.getElementById("sticky"), readMore=document.getElementById("readMore"), soundToggle=document.getElementById("soundToggle");

function playPageTurn(){
  if(!soundOn) return;
  const audio=document.getElementById("pageAudio");
  if(!audio) return;
  try{audio.currentTime=0;audio.volume=.24;audio.play().catch(()=>{})}catch(e){}
}
function blankFlipPage(){return `<div class="blank-flip-page"></div>`}
function makeDividers(){
  dividers.innerHTML=chapters.map(ch=>`<button class="divider" data-page="${ch.page}" data-id="${ch.id}">${ch.label}</button>`).join("");
  dividers.querySelectorAll(".divider").forEach(btn=>btn.addEventListener("click",e=>{e.stopPropagation();jumpTo(btn.dataset.page)}));
}
function activeChapter(){return chapters.slice().reverse().find(ch=>current>=ch.page)}
function updateDivider(){
  dividers.querySelectorAll(".divider").forEach(t=>t.classList.remove("active"));
  const active=activeChapter(); if(active){const btn=dividers.querySelector(`[data-id="${active.id}"]`); if(btn) btn.classList.add("active")}
}
function render(){
  const s=spreads[current];
  leftPage.innerHTML=s.left; rightPage.innerHTML=s.right;
  scene.classList.toggle("foldout-open",!!s.foldout);
  progress.textContent=`Spread ${current+1} / ${spreads.length}`;
  prevBtn.disabled=current===0||flipping; nextBtn.disabled=current===spreads.length-1||flipping;
  updateSticky(s.note,s.chapter); updateDivider(); bindVoicemail();
}
function updateSticky(note,chapter){
  sticky.className="sticky "+(chapter==="index"?"":chapter);
  document.getElementById("noteKicker").textContent=note.kicker;
  document.getElementById("noteTitle").textContent=note.title;
  document.getElementById("noteBody").textContent=note.body;
  document.getElementById("noteA").textContent=note.a;
  document.getElementById("noteB").textContent=note.b;
  document.getElementById("noteMore").textContent=note.more;
  readMore.textContent="Read More";
}
function openArchive(){
  if(opened) return;
  opened=true; topbar.textContent="Click right page to continue · left page to go back";
  scene.classList.add("opened"); render();
  requestAnimationFrame(()=>cover.classList.add("opening"));
}
function nextPage(){
  stopVoicemail();
  if(!opened||flipping||current>=spreads.length-1) return;
  flipping=true; playPageTurn();
  flipFront.innerHTML=blankFlipPage(); flipBack.innerHTML=blankFlipPage(); flipSheet.className="flip-sheet active";
  setTimeout(()=>{current++;render()},360);
  setTimeout(()=>{flipSheet.className="flip-sheet";flipping=false;render()},740);
}
function prevPage(){
  stopVoicemail();
  if(!opened||flipping||current<=0) return;
  flipping=true; playPageTurn();
  flipFront.innerHTML=blankFlipPage(); flipBack.innerHTML=blankFlipPage(); flipSheet.className="flip-sheet back active";
  setTimeout(()=>{current--;render()},360);
  setTimeout(()=>{flipSheet.className="flip-sheet";flipping=false;render()},740);
}
function jumpTo(page){
  stopVoicemail();
  page=Number(page);
  if(!opened||flipping||page===current) return;
  flipping=true;
  const steps=Math.min(Math.abs(page-current),5); let count=0;
  const interval=setInterval(()=>{playPageTurn(); count++; if(count>=steps){clearInterval(interval); current=page; render(); flipping=false}},120);
}
function bindVoicemail(){
  const card=document.getElementById("voicemailCard");
  if(!card) return;
  card.onclick=e=>{
    e.stopPropagation();
    const audio=document.getElementById("voicemailAudio"), badge=document.getElementById("playBadge");
    if(!audio) return;
    if(audio.paused){audio.volume=.9; audio.play().then(()=>{if(badge) badge.textContent="❚❚ PAUSE VOICEMAIL"}).catch(()=>{})}
    else{audio.pause(); if(badge) badge.textContent="▶ PLAY VOICEMAIL"}
  };
  const audio=document.getElementById("voicemailAudio");
  if(audio){audio.onended=()=>{const badge=document.getElementById("playBadge"); if(badge) badge.textContent="▶ PLAY VOICEMAIL"}}
}
function stopVoicemail(){const audio=document.getElementById("voicemailAudio"); if(audio&&!audio.paused){audio.pause();audio.currentTime=0}}
cover.onclick=openArchive; nextBtn.onclick=nextPage; prevBtn.onclick=prevPage; rightPage.onclick=nextPage; leftPage.onclick=prevPage;
readMore.onclick=()=>{sticky.classList.toggle("expanded");readMore.textContent=sticky.classList.contains("expanded")?"Show Less":"Read More"};
soundToggle.onclick=()=>{soundOn=!soundOn;soundToggle.textContent=soundOn?"Sound On":"Sound Off"};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nextPage(); if(e.key==="ArrowLeft")prevPage()});
makeDividers();
</script>
