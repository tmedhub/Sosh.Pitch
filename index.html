<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOSH Archive 2030</title>
<!--
Place this HTML in the same folder as:
dark.png, live.png, microphone.png, night.png, communal.png, workshop.png, ticket.png,
handwritten.png, poloroids.png, bali.png, japan.png, philippines.png, voicemail.png,
partnership.png if you have it, page-turn.mp4, voicemail.mp4.
-->

<style>
:root{
  --dark:#17110c;
  --paper:#f1dfb8;
  --paper2:#e6cfa0;
  --ink:#211711;
  --muted:#70583f;
  --gold:#c69a46;
  --gold2:#e2c16b;
  --red:#7b251b;
  --olive:#3c402f;
  --shadow:rgba(0,0,0,.55);
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", "Courier New", monospace;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14100c;color:var(--ink);font-family:var(--sans)}
body{
  background:
    radial-gradient(circle at 50% 35%, rgba(255,221,154,.36), transparent 34%),
    radial-gradient(circle at 50% 78%, rgba(0,0,0,.05), rgba(0,0,0,.78) 72%),
    url("dark.png") center/cover no-repeat,
    #15100c;
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:100;
  background:url("dark.png") center/cover repeat;
  opacity:.13;mix-blend-mode:screen;
}

.app{height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;position:relative;padding:28px}
.topbar{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:60;color:#ead6a5;text-align:center;
  font:800 10px/1 var(--mono);letter-spacing:2.2px;text-transform:uppercase;
  text-shadow:0 2px 6px #000;opacity:.92;
}
.progress{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:60;color:#e6d1a0;
  font:800 10px/1 var(--mono);letter-spacing:2px;text-transform:uppercase;
  text-shadow:0 2px 6px #000;opacity:.94;
}
.sound-toggle{
  position:fixed;right:22px;top:18px;z-index:90;
  border:1px solid rgba(230,205,148,.32);background:rgba(35,23,13,.78);color:#ead7a8;
  padding:10px 12px;border-radius:999px;
  font:900 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;
  box-shadow:0 9px 22px rgba(0,0,0,.32);
}
.sound-toggle:hover{background:#ead7a8;color:#25180d}

.scene{
  width:min(1420px,96vw);
  height:min(820px,86vh);
  display:grid;
  grid-template-columns:minmax(760px, 1fr) 360px;
  gap:18px;
  align-items:center;
  position:relative;
  perspective:2400px;
}

/* Book stage */
.book-area{
  height:100%;display:flex;align-items:center;justify-content:center;position:relative;transform-style:preserve-3d;
}

/* Closed Cover */
.cover{
  position:absolute;width:min(560px,46vw);height:min(690px,78vh);
  border-radius:23px 34px 34px 23px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.46),rgba(255,255,255,.08) 20%,rgba(0,0,0,.12) 50%,rgba(0,0,0,.36)),
    url("dark.png") center/cover no-repeat,
    linear-gradient(135deg,#28281f,#10110e);
  transform:rotateX(7deg) rotateZ(-1.2deg);
  transform-origin:left center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  z-index:30;
  cursor:pointer;
  box-shadow:
    0 46px 75px rgba(0,0,0,.72),
    inset 0 0 0 1px rgba(242,209,116,.42),
    inset 0 0 0 16px rgba(0,0,0,.12);
  transition:transform .55s ease, filter .55s ease;
}
.cover:hover{transform:rotateX(7deg) rotateZ(-1.2deg) translateY(-8px);filter:brightness(1.08)}
.cover:before{
  content:"";position:absolute;left:20px;top:22px;bottom:22px;width:44px;border-radius:18px;
  background:linear-gradient(90deg,rgba(0,0,0,.38),rgba(255,255,255,.11),rgba(0,0,0,.26));
}
.cover:after{
  content:"";position:absolute;inset:25px;border:1px solid rgba(237,204,103,.38);
  border-radius:18px 26px 26px 18px;
}
.logo-hole{
  position:absolute;top:62px;left:50%;transform:translateX(-50%);
  width:132px;height:62px;border:1px dashed rgba(232,199,107,.55);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:rgba(237,212,135,.8);font:900 9px var(--mono);letter-spacing:1.8px;text-transform:uppercase;
  z-index:2;
}
.cover-title{
  position:absolute;top:198px;left:0;right:0;text-align:center;z-index:2;
  color:#e8c86c;text-shadow:0 2px 0 rgba(85,53,15,.8),0 10px 30px rgba(0,0,0,.6);
  font-family:var(--serif);font-weight:700;
}
.cover-title .sosh{font-size:76px;line-height:.84;letter-spacing:3px}
.cover-title .archive{font-size:42px;line-height:1;letter-spacing:6px}
.cover-title .year{margin-top:16px;font:900 14px var(--mono);letter-spacing:8px;color:#dfc16d}
.cover-sub{
  position:absolute;left:0;right:0;bottom:92px;text-align:center;z-index:2;
  color:#dfca91;font:800 11px/1.6 var(--mono);letter-spacing:2px;text-transform:uppercase;
}
.cover.opening{
  animation:coverOpen 1.15s cubic-bezier(.18,.72,.16,1) forwards;
  pointer-events:none;
}
@keyframes coverOpen{
  0%{transform:rotateX(7deg) rotateZ(-1.2deg) rotateY(0);opacity:1}
  82%{transform:rotateX(7deg) rotateZ(-1.2deg) rotateY(-132deg);opacity:1}
  100%{transform:rotateX(7deg) rotateZ(-1.2deg) rotateY(-137deg);opacity:0;visibility:hidden}
}

/* Open Book */
.book{
  width:min(1000px,100%);
  height:min(655px,78vh);
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  transform:rotateX(5deg);
  transform-style:preserve-3d;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease;
  filter:drop-shadow(0 48px 60px rgba(0,0,0,.66));
}
.opened .book{opacity:1;pointer-events:auto}
.book-base{
  position:absolute;inset:-24px -30px;border-radius:30px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.36),rgba(255,255,255,.09) 50%,rgba(0,0,0,.34)),
    url("dark.png") center/cover no-repeat,
    #c8ad79;
  transform:translateZ(-25px);
  box-shadow:inset 0 0 0 2px rgba(242,213,154,.25), inset 0 0 0 11px rgba(55,34,16,.22);
}
.page{
  height:100%;position:relative;overflow:hidden;padding:42px 46px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.075),transparent 12%,transparent 88%,rgba(0,0,0,.08)),
    url("dark.png") center/cover no-repeat,
    var(--paper);
  color:var(--ink);
  border:1px solid rgba(83,55,27,.24);
  box-shadow:inset 0 0 30px rgba(72,48,23,.12);
}
.left-page{border-radius:18px 4px 4px 18px;cursor:w-resize}
.right-page{border-radius:4px 18px 18px 4px;cursor:e-resize}
.left-page:after{
  content:"";position:absolute;top:0;right:0;bottom:0;width:32px;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.23));pointer-events:none;
}
.right-page:after{
  content:"";position:absolute;top:0;left:0;bottom:0;width:32px;
  background:linear-gradient(90deg,rgba(0,0,0,.25),transparent);pointer-events:none;
}
.page-num{
  position:absolute;bottom:20px;font:900 10px var(--mono);letter-spacing:1.3px;color:#987a50;
}
.left-page .page-num{left:40px}.right-page .page-num{right:40px}

/* Divider tabs attached to book */
.dividers{
  position:absolute;
  left:calc(100% - 8px);
  top:64px;
  width:116px;
  z-index:12;
  display:flex;
  flex-direction:column;
  gap:8px;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease .95s;
}
.opened .dividers{opacity:1;pointer-events:auto}
.divider{
  height:34px;
  width:76px;
  border:0;
  cursor:pointer;
  text-align:left;
  padding:0 10px 0 13px;
  border-radius:0 9px 9px 0;
  background:#e2c274;
  color:#2a1b0f;
  box-shadow:9px 8px 18px rgba(0,0,0,.22), inset 0 0 0 1px rgba(77,46,15,.18);
  font:900 9px/34px var(--mono);
  letter-spacing:1px;
  text-transform:uppercase;
  transform:translateX(0) rotate(var(--r,0deg));
  transition:width .2s ease, transform .2s ease, filter .2s ease;
}
.divider:nth-child(2){--r:.8deg;background:#edd28d}
.divider:nth-child(3){--r:-.6deg;background:#dfbb74}
.divider:nth-child(4){--r:.4deg;background:#efd9a1}
.divider:nth-child(5){--r:-.8deg;background:#d8b16c}
.divider:nth-child(6){--r:.9deg;background:#ebcf90}
.divider:nth-child(7){--r:-.4deg;background:#d5ae69}
.divider:nth-child(8){--r:.5deg;background:#f0dca4}
.divider:hover,.divider.active{
  width:104px;
  filter:brightness(1.05);
}
.divider.active{
  background:#7b251b;
  color:#f9e2aa;
  box-shadow:12px 9px 22px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,226,160,.18);
}

/* Type */
h1,h2,h3,p{margin:0}
.kicker{font:900 10px var(--mono);letter-spacing:2.2px;text-transform:uppercase;color:var(--red);margin-bottom:13px}
.title-xl{font-family:var(--serif);font-size:56px;line-height:.9;letter-spacing:-2px;color:#211711}
.title{font-family:var(--serif);font-size:43px;line-height:.96;letter-spacing:-1.1px;color:#211711}
.caption-hand{
  font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  font-size:24px;line-height:1.05;color:#422a1b;transform:rotate(-1deg);
}
.copy{font:520 15px/1.58 var(--sans);color:#433326;max-width:430px}
.small{font:900 10px/1.5 var(--mono);letter-spacing:1.2px;color:#74593a;text-transform:uppercase}
.rule{height:1px;background:rgba(98,65,30,.23);margin:19px 0}
.bullets{padding-left:18px;margin:16px 0 0}
.bullets li{margin:8px 0;font:600 14px/1.4 var(--sans);color:#433326}
.date-stamp{
  display:inline-block;border:2px solid rgba(123,37,27,.48);color:var(--red);
  padding:7px 10px;font:900 10px var(--mono);letter-spacing:1.6px;text-transform:uppercase;
  transform:rotate(-3deg);
}
.archive-label{
  display:inline-block;background:#2b1b10;color:#f5dfad;border-radius:999px;
  padding:8px 11px;font:900 9px var(--mono);letter-spacing:1.5px;text-transform:uppercase;
}

/* Scrapbook elements */
.photo{
  position:relative;background:#f7ead0;padding:10px;border:1px solid rgba(86,56,25,.18);
  box-shadow:0 17px 28px rgba(55,34,16,.25);
  transform:rotate(-1.2deg);
}
.photo img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(.96)}
.photo.polaroid{padding-bottom:42px}
.photo .label{
  position:absolute;left:14px;right:14px;bottom:12px;
  font:900 9px var(--mono);letter-spacing:1.2px;color:#735638;text-transform:uppercase;
}
.tape{
  position:absolute;top:-13px;left:38%;width:82px;height:27px;background:rgba(228,208,155,.67);
  border:1px solid rgba(140,111,61,.18);box-shadow:0 3px 9px rgba(0,0,0,.12);
  transform:rotate(4deg);z-index:2;
}
.paper-chip{
  background:#f7e5b9;border:1px solid rgba(96,62,27,.18);padding:13px 14px;
  box-shadow:0 10px 20px rgba(66,41,18,.16);
  font:900 10px/1.3 var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:#2c1d12;
}
.paper-chip span{display:block;margin-top:7px;font:600 13px/1.34 var(--sans);letter-spacing:0;text-transform:none;color:#5d472f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stack{display:grid;gap:13px}

/* Next/Previous buttons */
.nav-buttons{
  position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);
  display:flex;gap:12px;z-index:45;opacity:0;pointer-events:none;transition:opacity .45s ease 1s;
}
.opened .nav-buttons{opacity:1;pointer-events:auto}
.nav-btn{
  border:1px solid rgba(230,205,148,.35);background:rgba(35,23,13,.8);color:#ead7a8;
  padding:12px 18px;border-radius:999px;
  font:900 10px var(--mono);letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;
  box-shadow:0 9px 20px rgba(0,0,0,.3);
}
.nav-btn:hover{background:#ead7a8;color:#25180d}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}

/* Flip sheet - opaque */
.flip-sheet{
  position:absolute;top:0;left:50%;width:50%;height:100%;z-index:25;
  display:none;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;
}
.flip-sheet.active{display:block;animation:flipForward .88s cubic-bezier(.2,.74,.18,1) forwards}
.flip-sheet.back{left:0;transform-origin:right center}
.flip-sheet.back.active{animation:flipBack .88s cubic-bezier(.2,.74,.18,1) forwards}
@keyframes flipForward{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes flipBack{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.face{
  position:absolute;inset:0;padding:42px 46px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:
    linear-gradient(90deg,rgba(0,0,0,.075),transparent 12%,transparent 88%,rgba(0,0,0,.08)),
    url("dark.png") center/cover no-repeat,
    #f1dfb8;
  border:1px solid rgba(83,55,27,.24);
  box-shadow:inset 0 0 30px rgba(72,48,23,.14),0 12px 32px rgba(0,0,0,.18);
}
.face.front{border-radius:4px 18px 18px 4px}
.face.backface{transform:rotateY(180deg);border-radius:18px 4px 4px 18px}
.flip-sheet.back .face.front{border-radius:18px 4px 4px 18px}
.flip-sheet.back .face.backface{border-radius:4px 18px 18px 4px}

/* Sticky note beside dividers */
.note-area{
  height:100%;position:relative;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .45s ease 1s;
}
.opened .note-area{opacity:1;pointer-events:auto}
.sticky{
  position:absolute;top:50%;left:42px;transform:translateY(-50%) rotate(1.2deg);
  width:315px;max-height:min(610px,74vh);overflow:auto;
  background:
    linear-gradient(180deg,rgba(255,248,204,.98),rgba(244,224,151,.98)),
    #f8e68f;
  color:#211711;border-radius:6px 6px 14px 6px;
  padding:26px 23px 22px;
  box-shadow:0 26px 60px rgba(0,0,0,.45), inset 0 -20px 40px rgba(138,100,21,.08);
  border:1px solid rgba(113,80,25,.18);
  transition:background .25s ease, transform .25s ease;
}
.sticky:before{
  content:"";position:absolute;top:-15px;left:50%;width:26px;height:26px;border-radius:50%;
  transform:translateX(-50%);
  background:radial-gradient(circle at 35% 35%,#fff2b7,#b41e15 45%,#65100b 75%);
  box-shadow:0 5px 12px rgba(0,0,0,.3);
}
.sticky:after{
  content:"";position:absolute;top:12px;right:28px;width:54px;height:17px;border:3px solid rgba(80,65,50,.42);
  border-left:0;border-radius:0 14px 14px 0;transform:rotate(18deg);
}
.sticky.social{background:linear-gradient(180deg,#fff3be,#f0d982)}
.sticky.events{background:linear-gradient(180deg,#fff0ad,#edcc75)}
.sticky.insider{background:linear-gradient(180deg,#ffe0d8,#efb7aa)}
.sticky.membership{background:linear-gradient(180deg,#e4f0ff,#bcd2e9)}
.sticky.signature{background:linear-gradient(180deg,#ffe7bd,#e5be7e)}
.sticky.between{background:linear-gradient(180deg,#fff0c8,#eccf8d)}
.sticky.partners{background:linear-gradient(180deg,#ead8b1,#cfae76)}
.sticky.roadmap{background:linear-gradient(180deg,#dcefff,#a9c8e2)}
.note-kicker{font:900 10px var(--mono);letter-spacing:1.7px;text-transform:uppercase;color:#842a1e;margin-bottom:12px}
.note-title{font-family:var(--serif);font-size:27px;line-height:.96;letter-spacing:-.6px;margin-bottom:14px}
.note-body{font:560 13.2px/1.52 var(--sans);color:#3a2b1f}
.note-section{
  margin-top:15px;padding-top:13px;border-top:1px solid rgba(102,74,26,.2);
}
.note-section b{
  display:block;font:900 10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:#7a251b;margin-bottom:7px;
}
.read-more{
  margin-top:18px;border:0;background:#2b1b10;color:#f8e8aa;border-radius:999px;
  padding:10px 14px;font:900 10px var(--mono);letter-spacing:1.3px;text-transform:uppercase;cursor:pointer;
}
.read-more:hover{background:#7b251b}
.more{display:none;margin-top:15px}
.sticky.expanded .more{display:block}

/* Blueprint foldout */
.foldout-open .book{width:min(1180px,100%);}
.foldout-open .right-page{overflow:visible}
.foldout-panel{
  position:absolute;left:16px;right:-170px;top:58px;height:450px;z-index:8;
  background:
    linear-gradient(180deg,rgba(234,215,168,.9),rgba(210,188,142,.9)),
    url("handwritten.png") center/cover no-repeat,#e6d0a1;
  border:1px solid rgba(78,54,27,.24);
  box-shadow:0 25px 45px rgba(0,0,0,.28);
  transform-origin:left center;
  animation:unfold 1s cubic-bezier(.2,.74,.18,1) both;
  padding:38px;
}
@keyframes unfold{from{transform:scaleX(.18);opacity:.3}to{transform:scaleX(1);opacity:1}}
.roadmap{
  display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:24px;
}
.roadmap div{
  border:1px solid rgba(56,43,28,.28);padding:14px 10px;text-align:center;background:rgba(255,244,210,.52);
  font:900 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;
}

/* Mobile */
@media(max-width:1120px){
  .scene{grid-template-columns:1fr 350px;gap:12px}
  .sticky{width:330px}
  .title-xl{font-size:45px}.title{font-size:35px}.caption-hand{font-size:20px}
  .page,.face{padding:34px 36px}
}
@media(max-width:900px){
  body{overflow:auto}
  html,body{height:auto;min-height:100%}
  .app{height:auto;min-height:100vh;align-items:flex-start}
  .scene{grid-template-columns:1fr;gap:20px;height:auto;margin-top:50px}
  .book-area{height:700px}
  .note-area{height:460px}
  .sticky{left:50%;transform:translateX(-50%) rotate(1deg);top:0}
  .cover{width:82vw}
  .book{width:96vw;height:620px}
  .dividers{left:auto;right:-2px;top:74px}
}

.voicemail-card{position:relative}
.play-badge{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(35,23,13,.86);color:#f7df9d;border:1px solid rgba(247,223,157,.45);
  padding:12px 16px;border-radius:999px;
  font:900 10px var(--mono);letter-spacing:1.5px;text-transform:uppercase;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}
.voicemail-card:hover .play-badge{background:#7b251b;color:#fff1bd}

</style>
</head>

<body>
<button class="sound-toggle" id="soundToggle">Sound On</button>
<div class="topbar" id="topbar">Click the cover to open the archive</div>
<div class="progress" id="progress">Closed archive</div>

<!-- Required audio files in the same folder:
     page-turn.mp4
     voicemail.mp4 -->
<audio id="coverAudio" preload="auto" src=""></audio>
<audio id="pageAudio" preload="auto" src="page-turn.mp4"></audio>
<audio id="riffleAudio" preload="auto" src="page-turn.mp4"></audio>
<audio id="unfoldAudio" preload="auto" src=""></audio>
<audio id="noteAudio" preload="auto" src="page-turn.mp4"></audio>
<audio id="voicemailAudio" preload="auto" src="voicemail.mp4"></audio>

<main class="app">
  <section class="scene" id="scene">

    <section class="book-area">
      <div class="cover" id="cover">
        <div class="logo-hole">Logo Here</div>
        <div class="cover-title">
          <div class="sosh">SOSH</div>
          <div class="archive">ARCHIVE</div>
          <div class="year">2030</div>
        </div>
        <div class="cover-sub">A record of how belonging evolved</div>
      </div>

      <div class="book" id="book">
        <div class="book-base"></div>
        <article class="page left-page" id="leftPage" title="Previous page"></article>
        <article class="page right-page" id="rightPage" title="Next page"></article>

        <nav class="dividers" id="dividers"></nav>

        <div class="flip-sheet" id="flipSheet">
          <div class="face front" id="flipFront"></div>
          <div class="face backface" id="flipBack"></div>
        </div>

        <div class="nav-buttons">
          <button class="nav-btn" id="prevBtn">← Previous</button>
          <button class="nav-btn" id="nextBtn">Next →</button>
        </div>
      </div>
    </section>

    <aside class="note-area">
      <div class="sticky" id="sticky">
        <div class="note-kicker" id="noteKicker">Strategy note</div>
        <h2 class="note-title" id="noteTitle">Open the archive</h2>
        <p class="note-body" id="noteBody">Turn the pages. The note changes with each spread.</p>
        <div class="note-section">
          <b>Why it matters</b>
          <p class="note-body" id="noteA"></p>
        </div>
        <div class="note-section">
          <b>How it works</b>

note:{kicker:"Chapter 1 / Social",title:"How Sosh evolved from events into media",body:"The media layer becomes the front door to the Sosh world. People first discover Sosh through a feeling: a sharp observation, a recommendation, a conversation, or a clip that feels exactly like their life.",a:"Events are limited by space. Media makes the feeling travel. It lets Sosh build trust before someone ever enters a room.",b:"Social is divided into Live Shows, Sosh Radio, Short Form, Long Form, Creator Conversations and Audience Participation. Together, they create a loop from attention to trust to attendance.",more:"The goal is not to become a generic content company. The goal is to make Sosh’s taste, humor, honesty and emotional intelligence visible every day, so attending an event feels like entering a world people already understand."},

{
chapter:"social",
note:{kicker:"Social / Sosh Radio",title:"Sosh Radio",body:"Sosh Radio is the intimate audio layer: car rides, dinner drives, city notes, recommendations and unscripted reflections. It makes the founders feel present in people’s lives without needing a formal studio.",a:"It gives the brand warmth. People do not just want places to go; they want the voice and taste of people they trust.",b:"Episodes can be voice-note style, podcast style or short audio dispatches. The best format is casual: recorded on the way to dinner, after an event, or while trying something new in a city.",more:"This creates a repeatable media property. A night drive can become one podcast, five reels, a newsletter, a city recommendation list and a pre-event trust builder."},

chapter:"social",
note:{kicker:"Social / Short Form",title:"Short Form",body:"Short form should be built around precise social observations and location-led feelings, not generic listicles. The best Sosh content feels like someone finally named a situation you have experienced.",a:"Saves and shares are more important than likes because they show usefulness. People save a recommendation when they want to return to it later or send it to someone.",b:"Use hooks like: places that feel like Sunday even on Wednesday; where to go alone without feeling alone; restaurants for when you want to talk for three hours.",more:"This creates an acquisition engine. Every post can point to a guide, a Sosh Radio episode, a live show topic, a Discovery Event, or a partner venue. Short form becomes the map into the world."},

chapter:"social",
note:{kicker:"Social / Long Form",title:"Long Form",body:"Long form is where Sosh builds trust. The topics Sosh already owns — dating, adulthood, loneliness, friendship, food, taste, city life — need more room than a two-minute clip.",a:"People crave the true unfiltered friendship between the founders. Long form lets the audience stay long enough to trust the taste and thinking behind the recommendations.",b:"Use podcasts, essays, annotated transcripts, behind-the-scenes dinners, trying new food in new cities and city diaries. Clip every long-form piece into short-form distribution.",more:"The flywheel: long form creates depth, short form distributes it, live shows make it participatory, and events convert that trust into real-world community."},

{
chapter:"events",
note:{kicker:"Events / Food Experiences",title:"Food Experiences",body:"Food is Sosh’s natural social technology. It gives people a shared table, a pacing structure and a reason to stay longer than they planned.",a:"Food lowers social friction. People remember who they sat beside, what they ordered, what was shared and what conversation happened between courses.",b:"Formats can include build-your-signature drink, BYO last meal, dinner with question jenga, neighbourhood tasting routes and chef-led tables.",more:"Food experiences can become the backbone of partnerships with restaurants, cafés, coffee roasters and hotels. They can also become Sosh city guides and content series."},
left:`<div class="kicker">Food Experiences</div><h2 class="title">The table did half the hosting.</h2><p class="copy" style="margin-top:18px">Dinners, tasting routes, last meals, shared courses and meals that gave people a reason to linger.</p><span class="page-num">023</span>`,

{
chapter:"events",
note:{kicker:"Events / Movement",title:"Sports With A Twist + City Walks",body:"Not every Sosh experience should be seated. Movement creates a lighter social mood and lets people meet without the pressure of constant eye contact.",a:"Sports and walks give structure to casual connection. They are easy to repeat, easy to theme and easy to document.",b:"Sports with a twist can include playful leagues, low-skill tournaments, social scoring or post-game meals. City Walks can include cafés, architecture, bookstores, sunrise points and neighbourhood stories.",more:"These formats help Sosh expand across cities because each city already has parks, streets, food spots and local routes. Sosh’s role is curation, hosting and memory design."},

chapter:"insider",
note:{kicker:"Chapter 3 / Inside the Insider",title:"Smaller rooms. Deeper belonging.",body:"Inside the Insider is where Sosh stops being an event brand and becomes a relationship. These formats are smaller, more personal and more emotionally designed.",a:"People return when they feel recognized. The Insider layer rewards return with intimacy, not discounts.",b:"Archive Night, Grief Table, BYO Last Meal, House Party, Sunday Club and Dinner Experiments are designed to feel personal, human and slightly sacred.",more:"This chapter builds retention and emotional depth. It creates the moments people tell close friends about but cannot fully explain online."},
left:`<div class="kicker">Chapter 3</div><h1 class="title-xl">Inside the Insider</h1><p class="copy">Smaller rooms. Deeper belonging.</p><div class="rule"></div><div class="paper-chip">Tone<span>Intimate · personal · emotional · human</span></div><span class="page-num">027</span>`,

{
chapter:"insider",
note:{kicker:"Inside / Archive Night",title:"Archive Night",body:"Archive Night asks members to bring objects, photos, voice notes, messages or memories from their lives. The room becomes a living scrapbook.",a:"It gives people a way to share without performing. Objects carry stories better than introductions do.",b:"The host curates prompts around memory: a place you miss, a message you never deleted, a food tied to someone, a photo that still feels alive.",more:"This can feed the annual Sosh Book, future exhibitions, member spotlights and community rituals. It also perfectly mirrors the website concept itself."},

note:{kicker:"Inside / Grief Table",title:"Grief Table",body:"Grief Table is a carefully hosted dinner for conversations about loss, change, endings and adulthood. It must be held with sensitivity and strong facilitation.",a:"Community is not only built through fun. Deep belonging often forms when people feel safe enough to be honest.",b:"Small group, clear consent, careful prompts, no forced vulnerability, beautiful food, and a trained host or partner where needed.",more:"This format should be rare and protected. If done well, it becomes one of the most meaningful Sosh rooms — not for content, but for trust."},

{
chapter:"membership",
note:{kicker:"Chapter 4 / Membership Evolution",title:"Not loyalty. Identity.",body:"Sosh membership should not feel like a points program. It should feel like a person’s relationship with the world becoming deeper over time.",a:"The system rewards loyalty with intimacy. More return means smaller rooms, better matching, deeper access and more ability to shape the story.",b:"Curious begins after the first event. Insider begins after repeated return. Original begins when members become contributors and hosts.",more:"This gives Sosh a scalable structure without becoming cold. It also creates status that does not feel cringe because it is based on participation and contribution."},

{

note:{kicker:"Membership / Three Identities",title:"Curious, Insider, Original",body:"Each level represents a deeper relationship with Sosh. The language should feel warm and identity-led, not transactional.",a:"Curious means the person has entered. Insider means they have returned. Original means they have helped shape the community.",b:"Curious unlocks waitlists and recommendations. Insider unlocks intimate events and priority matching. Original unlocks micro experiences, annual trips and host opportunities.",more:"This becomes especially powerful during city expansion. Originals can help seed Hyderabad, Pune and other cities as trusted community anchors."},

},
{
chapter:"membership",
note:{kicker:"Membership / Rituals",title:"Membership Rituals",body:"Membership needs physical and emotional proof. The strongest markers are not loud merch but small objects people keep.",a:"Sosh’s audience is allergic to anything try-hard. The objects should feel like personal archive materials, not branded giveaways.",b:"Use welcome notes, wristbands, annual books, priority invites, reserved seat cards, city guides, small badges and handwritten founder notes.",more:"The best membership objects feel like they belong in a drawer years later. That is why the archive aesthetic is not just design; it is part of the membership strategy."},

let current = 0;
let opened = false;
let flipping = false;
let soundOn = true;
let audioContext = null;

const scene = document.getElementById("scene");
const cover = document.getElementById("cover");
const leftPage = document.getElementById("leftPage");
const rightPage = document.getElementById("rightPage");
const flipSheet = document.getElementById("flipSheet");
const flipFront = document.getElementById("flipFront");
const flipBack = document.getElementById("flipBack");
const progress = document.getElementById("progress");
const topbar = document.getElementById("topbar");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const dividers = document.getElementById("dividers");
const sticky = document.getElementById("sticky");
const readMore = document.getElementById("readMore");
const soundToggle = document.getElementById("soundToggle");

function audioCtx(){
  if(!audioContext){
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioContext;
}

function playSynthetic(kind="page"){
  if(!soundOn) return;
  try{
    const ctx = audioCtx();
    const dur = kind === "riffle" ? 0.16 : kind === "cover" ? 0.22 : kind === "unfold" ? 0.32 : 0.18;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const t=i/data.length;
      const noise=(Math.random()*2-1);
      const env=Math.pow(1-t, kind==="unfold"?1.5:2.8) * Math.min(1,t*24);
      data[i]=noise*env*(kind==="cover"?.09:kind==="riffle"?.06:kind==="unfold"?.07:.055);
    }
    const src=ctx.createBufferSource();
    const filter=ctx.createBiquadFilter();
    const gain=ctx.createGain();
    filter.type="bandpass";
    filter.frequency.value = kind==="cover" ? 520 : kind==="unfold" ? 760 : 1100;
    filter.Q.value = .8;
    gain.gain.value = .65;
    src.buffer=buffer;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start();
  }catch(e){}
}

function playAudio(id, kind){
  if(!soundOn) return;
  const el = document.getElementById(id);
  if(el){
    try{
      el.currentTime = 0;
      el.volume = kind==="cover" ? .32 : kind==="riffle" ? .22 : kind==="unfold" ? .3 : .24;
      const p = el.play();
      if(p && p.catch) p.catch(()=>playSynthetic(kind));
      return;
    }catch(e){}
  }
  playSynthetic(kind);
}

function makeDividers(){
  dividers.innerHTML = chapters.map(ch => `<button class="divider" data-page="${ch.page}" data-id="${ch.id}" title="${ch.label}">${ch.label}</button>`).join("");
  dividers.querySelectorAll(".divider").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const p = Number(btn.dataset.page);
      jumpToWithRiffle(p);
    });
  });
}

function updateDivider(){
  dividers.querySelectorAll(".divider").forEach(t=>t.classList.remove("active"));
  const active = chapters.slice().reverse().find(ch => current >= ch.page);
  if(active){
    const btn = dividers.querySelector(`[data-id="${active.id}"]`);
    if(btn) btn.classList.add("active");
  }
}

function chapterClass(ch){
  if(ch === "index") return "";
  return ch;
}

function render(){
  const s = spreads[current];
  leftPage.innerHTML = s.left;
  rightPage.innerHTML = s.right;
  scene.classList.toggle("foldout-open", !!s.foldout);
  progress.textContent = `Spread ${current + 1} / ${spreads.length}`;
  prevBtn.disabled = current === 0 || flipping;
  nextBtn.disabled = current === spreads.length - 1 || flipping;
  updateSticky(s.note, s.chapter);
  updateDivider();

}

function updateSticky(note, chapter){
  sticky.className = "sticky " + chapterClass(chapter);
  document.getElementById("noteKicker").textContent = note.kicker;
  document.getElementById("noteTitle").textContent = note.title;
  document.getElementById("noteBody").textContent = note.body;
  document.getElementById("noteA").textContent = note.a;
  document.getElementById("noteB").textContent = note.b;
  document.getElementById("noteMore").textContent = note.more;
  readMore.textContent = "Read More";
}

function openArchive(){
  if(opened) return;
  opened = true;
  cover.classList.add("opening");
  topbar.textContent = "Click right page to continue · left page to go back";
  setTimeout(()=>{
    scene.classList.add("opened");
    render();
  }, 1120);
}

function nextPage(){
  stopVoicemail();
  if(!opened || flipping || current >= spreads.length-1) return;
  flipping = true;
  playAudio("pageAudio","page");
  const from = spreads[current];
  const to = spreads[current + 1];
  flipFront.innerHTML = from.right;
  flipBack.innerHTML = to.left;
  flipSheet.className = "flip-sheet active";
  scene.classList.remove("foldout-open");
  setTimeout(()=>{
    current++;
    render();
    flipSheet.className = "flip-sheet";
    flipping = false;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === spreads.length - 1;
  }, 880);
}

function prevPage(){
  stopVoicemail();
  if(!opened || flipping || current <= 0) return;
  flipping = true;
  playAudio("pageAudio","page");
  const from = spreads[current];
  const to = spreads[current - 1];
  flipFront.innerHTML = from.left;
  flipBack.innerHTML = to.right;
  flipSheet.className = "flip-sheet back active";
  scene.classList.remove("foldout-open");
  setTimeout(()=>{
    current--;
    render();
    flipSheet.className = "flip-sheet";
    flipping = false;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === spreads.length - 1;
  }, 880);
}

function jumpToWithRiffle(page){
  stopVoicemail();
  if(!opened || flipping || page === current) return;
  flipping = true;
  const direction = page > current ? 1 : -1;
  let steps = Math.min(Math.abs(page-current), 7);
  let count = 0;
  const riff = setInterval(()=>{
    playAudio("riffleAudio","riffle");
    count++;
    if(count >= steps){
      clearInterval(riff);
      current = Math.max(0, Math.min(spreads.length-1, page));
      render();
      flipping = false;
    }
  }, 120);
}


function bindVoicemail(){
  const card = document.getElementById("voicemailCard");
  if(!card) return;
  card.addEventListener("click", (e)=>{
    e.stopPropagation();
    const audio = document.getElementById("voicemailAudio");
    const badge = document.getElementById("playBadge");
    if(!audio) return;
    if(audio.paused){
      audio.play().then(()=>{
        if(badge) badge.textContent = "❚❚ PAUSE VOICEMAIL";
      }).catch(()=>{});
    } else {
      audio.pause();
      if(badge) badge.textContent = "▶ PLAY VOICEMAIL";
    }
  });
  const audio = document.getElementById("voicemailAudio");
  if(audio){
    audio.onended = ()=>{
      const badge = document.getElementById("playBadge");
      if(badge) badge.textContent = "▶ PLAY VOICEMAIL";
    };
  }
}

function stopVoicemail(){
  const audio = document.getElementById("voicemailAudio");
  if(audio && !audio.paused){
    audio.pause();
    audio.currentTime = 0;
  }
}

cover.addEventListener("click", openArchive);
nextBtn.addEventListener("click", nextPage);
prevBtn.addEventListener("click", prevPage);
rightPage.addEventListener("click", nextPage);
leftPage.addEventListener("click", prevPage);

readMore.addEventListener("click", ()=>{
  sticky.classList.toggle("expanded");
  readMore.textContent = sticky.classList.contains("expanded") ? "Show Less" : "Read More";
  playAudio("noteAudio","page");
});

soundToggle.addEventListener("click",()=>{
  soundOn = !soundOn;
  soundToggle.textContent = soundOn ? "Sound On" : "Sound Off";
});

document.addEventListener("keydown",(e)=>{
  if(e.key === "ArrowRight") nextPage();
  if(e.key === "ArrowLeft") prevPage();
});

makeDividers();
leftPage.innerHTML = "";
rightPage.innerHTML = "";
</script>
</body>
</html>
